services:
  arcz-earth:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      ARCZ_NETWORK_MODE: offline_strict
      ARCZ_SEM_NAVEGADOR: "1"
      ARCZ_PORT: "8123"
    volumes:
      - ./data:/opt/arcz/data
      - ./jobs:/opt/arcz/jobs
      - ./logs:/opt/arcz/logs
      - ./exportacoes:/opt/arcz/exportacoes
      - ./renders:/opt/arcz/renders
    restart: "no"
