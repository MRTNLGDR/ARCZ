name: ARCZ Aedifex Test URL Policy Patch

on:
  push:
    branches:
      - agent/arcz-100-done
    paths:
      - .github/workflows/_patch-aedifex-test-url-policy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arcz-100-done
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add source-scoped test fixture rule
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('integrations/aedifex/CONVERSION_COVERAGE.json')
          doc = json.loads(path.read_text(encoding='utf-8'))
          rules = doc['categories']['external_urls']
          marker = 'TEST_ONLY_URL_FIXTURE'
          if not any(rule.get('status') == marker for rule in rules):
              fallback = next(i for i, rule in enumerate(rules) if rule.get('pattern') == '*')
              rules.insert(fallback, {
                  'pattern': '*',
                  'source_patterns': [
                      '*.test.ts', '*.test.tsx', '*.test.js', '*.test.jsx',
                      '*.spec.ts', '*.spec.tsx', '*.spec.js', '*.spec.jsx'
                  ],
                  'status': marker,
                  'owner': 'test-tooling',
                  'integration': 'URL literal appears exclusively in test/spec sources and is not part of the shipped runtime.',
                  'rationale': 'Security/validation fixtures remain visible in inventory but do not grant runtime egress.'
              })
          path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python -m json.tool integrations/aedifex/CONVERSION_COVERAGE.json >/dev/null
          python -m pip install -q -r requirements-dev.txt
          python -m pytest -q
      - name: Commit verified policy
        shell: bash
        run: |
          rm -f .github/workflows/_patch-aedifex-test-url-policy.yml
          git config user.name 'ARCZ CI'
          git config user.email 'actions@users.noreply.github.com'
          git add integrations/aedifex/CONVERSION_COVERAGE.json .github/workflows/_patch-aedifex-test-url-policy.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: classify Aedifex test-only URL fixtures'
          git push origin HEAD:agent/arcz-100-done
