name: ARCZ Windows User Flow

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcz-windows-user-${{ github.ref }}
  # A clean-Windows ARCZ.bat run can spend several minutes materializing the
  # controlled vendors/toolchains. Follow-up commits queue instead of deleting
  # the evidence of a run already in progress.
  cancel-in-progress: false

jobs:
  windows-user-flow:
    name: One BAT → setup → tests → healthy app
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Parse canonical PowerShell launcher
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/windows/arcz-launch.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List -Force
            exit 1
          }

      - name: Run exactly the user entrypoint
        shell: cmd
        run: ARCZ.bat -SkipUpdate -NoBrowser

      - name: Verify server, Modelar sidecar and real Cycles render
        shell: powershell
        run: |
          $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8123/api/v2/health' -TimeoutSec 10
          if (-not $health.ok) { throw 'ARCZ health returned ok=false' }
          if ($health.network_mode -ne 'offline_strict') { throw "network_mode=$($health.network_mode)" }

          if (-not (Test-Path 'vendor/cesium/Cesium/Cesium.js')) { throw 'Cesium vendor absent' }
          if (-not (Test-Path 'vendor/aedifex-floorplanner/arcz-aedifex-build.json')) { throw 'Aedifex vendor absent' }
          if (-not (Test-Path 'vendor/blender/manifest.json')) { throw 'Blender vendor absent' }
          if (-not (Test-Path 'target/release/arcz-generation-cli.exe')) { throw 'Rust release worker absent' }
          if (-not (Test-Path 'target/release/arcz-osm-cli.exe')) { throw 'OSM release worker absent' }

          # This is the same runtime action used by FloorplannerClient when the
          # user enters Modelar. A vendor merely present on disk is insufficient.
          $aedifex = Invoke-RestMethod `
            -Method Post `
            -Uri 'http://127.0.0.1:8123/api/v2/aedifex/start' `
            -ContentType 'application/json' `
            -Body '{"wait_seconds":45}' `
            -TimeoutSec 60
          if (-not $aedifex.ready) { throw 'Aedifex start endpoint returned ready=false' }
          $runtimeUrl = [string]$aedifex.runtime.url
          $runtimeUri = [Uri]$runtimeUrl
          if ($runtimeUri.Scheme -ne 'http' -or $runtimeUri.Host -notin @('127.0.0.1','localhost','::1')) {
            throw "Aedifex runtime is not loopback: $runtimeUrl"
          }
          $aedifexHealth = Invoke-RestMethod -Uri ($runtimeUrl.TrimEnd('/') + '/api/health') -TimeoutSec 15
          if (-not $aedifexHealth.ok) { throw 'Aedifex sidecar health returned ok=false' }

          # Base photoreal does not depend on diffusion weights, but it must be
          # more than a binary/version probe: render through the production ARCZ
          # worker and validate the generated PNG/.blend/manifest hashes.
          & '.\.venv\Scripts\python.exe' 'tools\photoreal_preflight.py' '--json'
          if ($LASTEXITCODE -ne 0) { throw "Cycles preflight failed with $LASTEXITCODE" }
          & '.\.venv\Scripts\python.exe' 'tools\smoke_blender_cycles.py' '--keep-output' '.arcz\cycles-smoke'
          if ($LASTEXITCODE -ne 0) { throw "Real Cycles smoke failed with $LASTEXITCODE" }
          if (-not (Test-Path '.arcz\cycles-smoke\output\render\cycles-smoke.png')) {
            throw 'Production Cycles worker did not create the expected PNG'
          }

      - name: Install verified IfcOpenShell and prove real IFC roundtrip
        shell: powershell
        run: |
          $env:ARCZ_NETWORK_MODE = 'import_assisted'
          & '.\.venv\Scripts\python.exe' 'tools\install_ifcopenshell.py'
          if ($LASTEXITCODE -ne 0) { throw "IfcOpenShell controlled install failed with $LASTEXITCODE" }
          $env:ARCZ_NETWORK_MODE = 'offline_strict'
          & '.\.venv\Scripts\python.exe' 'tools\smoke_ifcopenshell.py'
          if ($LASTEXITCODE -ne 0) { throw "IfcOpenShell functional smoke failed with $LASTEXITCODE" }
          if (-not (Test-Path 'vendor\ifcopenshell\manifest.json')) { throw 'IfcOpenShell vendor manifest absent' }
          if (-not (Test-Path 'vendor\ifcopenshell\LICENSE')) { throw 'IfcOpenShell license evidence absent' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcz-windows-user-logs
          path: |
            .arcz/logs/
            .arcz/interactive-preflight.json
            .arcz/cycles-smoke/output/manifest.json
            .arcz/cycles-smoke/output/render/cycles-smoke.png
            vendor/ifcopenshell/manifest.json
            vendor/ifcopenshell/LICENSE
          if-no-files-found: warn
