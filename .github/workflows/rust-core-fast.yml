name: ARCZ Rust Core Fast Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcz-rust-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arcz-100-done
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Normalize source and resolve lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Commit deterministic Rust state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo 'Rust source and lockfile already normalized'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Cargo.lock crates
            git commit -m 'style: normalize Rust source and lock dependencies'
            git push origin HEAD:agent/arcz-100-done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: arcz-fast-rust-state
          path: |
            Cargo.lock
            crates/**/*.rs
          if-no-files-found: error
      - name: Check non-desktop workspace
        run: cargo check --locked --workspace --all-targets --exclude arcz-tauri
      - name: Test non-desktop workspace
        run: cargo test --locked --workspace --all-targets --exclude arcz-tauri
