name: ARCZ Aedifex Network Policy Patch

on:
  push:
    branches:
      - agent/arcz-100-done
    paths:
      - .github/workflows/_patch-aedifex-network-policy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arcz-100-done
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed exact admission rules
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('integrations/aedifex/CONVERSION_COVERAGE.json')
          doc = json.loads(path.read_text(encoding='utf-8'))
          categories = doc['categories']

          env_rules = [
            {
              'pattern': 'AEDIFEX_ALLOWED_ASSET_ORIGINS',
              'status': 'SECURITY_ALLOWLIST_NARROWING',
              'owner': 'network-security',
              'integration': 'Optional origin allowlist only narrows asset URL acceptance; ARCZ offline_strict injects no remote asset origins.',
              'rationale': 'Used by Aedifex asset validation and SSRF-safe fetch as an additional restriction, not as an egress provider.'
            },
            {
              'pattern': 'AEDIFEX_DEV_DIAGNOSTICS',
              'status': 'DEV_ONLY_DIAGNOSTICS',
              'owner': 'floorplanner-shell',
              'integration': 'Original editor development diagnostics are not enabled in the shipped ARCZ host.',
              'rationale': 'Upstream only reads this when NODE_ENV is development.'
            },
            {
              'pattern': 'AEDIFEX_MCP_HTTP_LOOPBACK_ANY_ORIGIN',
              'status': 'UNUSED_HTTP_TRANSPORT_SECURITY_CONTROL',
              'owner': 'arcz-global-chat',
              'integration': 'ARCZ uses the in-memory MCP bridge; the optional upstream HTTP transport is not exposed by the shipped floorplanner sidecar.',
              'rationale': 'If upstream HTTP transport is ever enabled it remains loopback/auth guarded and requires a separate release-gate change.'
            },
            {
              'pattern': 'AEDIFEX_MCP_HTTP_ORIGINS',
              'status': 'UNUSED_HTTP_TRANSPORT_SECURITY_CONTROL',
              'owner': 'arcz-global-chat',
              'integration': 'ARCZ uses the in-memory MCP bridge; this CORS allowlist is not injected into the shipped sidecar.',
              'rationale': 'Exact upstream HTTP security control, not a remote provider credential.'
            },
            {
              'pattern': 'AEDIFEX_MCP_HTTP_TOKEN',
              'status': 'UNUSED_HTTP_TRANSPORT_SECURITY_CONTROL',
              'owner': 'arcz-global-chat',
              'integration': 'ARCZ uses the in-memory MCP bridge; no MCP HTTP token is persisted or injected by the floorplanner host.',
              'rationale': 'Upstream requires this token before binding its optional HTTP transport to a non-loopback interface.'
            },
            {
              'pattern': 'AEDIFEX_SCENE_API_ORIGINS',
              'status': 'UPSTREAM_APP_SECURITY_CONTROL_NOT_SHIPPED',
              'owner': 'floorplanner-shell',
              'integration': 'The original Next editor API is not the ARCZ runtime; ARCZ overlay routes own their own loopback policy.',
              'rationale': 'Exact CORS control for an upstream app route excluded from the shipped host.'
            },
            {
              'pattern': 'AEDIFEX_SCENE_API_RATE_LIMIT',
              'status': 'UPSTREAM_APP_SECURITY_CONTROL_NOT_SHIPPED',
              'owner': 'floorplanner-shell',
              'integration': 'The original Next editor API is not the ARCZ runtime; ARCZ overlay routes own rate limiting.',
              'rationale': 'Exact rate-limit control for an upstream app route excluded from the shipped host.'
            },
            {
              'pattern': 'AEDIFEX_SCENE_API_TOKEN',
              'status': 'UPSTREAM_APP_SECURITY_CONTROL_NOT_SHIPPED',
              'owner': 'floorplanner-shell',
              'integration': 'The original Next editor API is not the ARCZ runtime; this token is never persisted or injected by ARCZ.',
              'rationale': 'Exact auth control for an upstream app route excluded from the shipped host.'
            },
            {
              'pattern': 'PORT',
              'status': 'STANDARD_LOCAL_PORT',
              'owner': 'floorplanner-runtime',
              'integration': 'Local development/server port only; ARCZ runtime endpoints remain explicitly loopback-scoped.',
              'rationale': 'Port selection alone grants no egress or provider authority.'
            },
            {
              'pattern': 'SKIP_ENV_VALIDATION',
              'status': 'BUILD_ONLY_ENV_VALIDATION_SWITCH',
              'owner': 'toolchain',
              'integration': 'Retained only for the upstream Next build environment and not injected into ARCZ runtime state.',
              'rationale': 'Build-time validation switch, not a credential or network endpoint.'
            },
          ]

          url_rules = [
            {
              'pattern': 'http://${requestHost*',
              'status': 'SAME_ORIGIN_TEMPLATE',
              'owner': 'network-security',
              'integration': 'Dynamic request-host comparison used by the upstream CORS guard; it is not a fixed remote endpoint.',
              'rationale': 'Same-origin validation string.'
            },
            {
              'pattern': 'https://${requestHost*',
              'status': 'SAME_ORIGIN_TEMPLATE',
              'owner': 'network-security',
              'integration': 'Dynamic request-host comparison used by the upstream CORS guard; it is not a fixed remote endpoint.',
              'rationale': 'Same-origin validation string.'
            },
            {
              'pattern': 'http://localhost*',
              'status': 'LOOPBACK_ONLY_REFERENCE',
              'owner': 'network-security',
              'integration': 'Loopback URL used for local parsing, local APIs or tests; ARCZ runtime policy still mediates network calls.',
              'rationale': 'Cannot identify a public provider or external dependency.'
            },
            {
              'pattern': 'http://127.*',
              'status': 'LOOPBACK_ONLY_REFERENCE',
              'owner': 'network-security',
              'integration': 'IPv4 loopback URL used by local transports/tests; no public egress authority.',
              'rationale': 'Loopback address class.'
            },
            {
              'pattern': 'http://[[]::1]*',
              'status': 'LOOPBACK_ONLY_REFERENCE',
              'owner': 'network-security',
              'integration': 'IPv6 loopback URL used by local transports/tests; no public egress authority.',
              'rationale': 'Loopback address class.'
            },
            {
              'pattern': 'http://10.*',
              'status': 'PRIVATE_NETWORK_SECURITY_REFERENCE',
              'owner': 'network-security',
              'integration': 'Private-network literal is retained only as audited security/test input; ARCZ offline_strict does not grant private-network egress.',
              'rationale': 'RFC1918 address class, not a public provider dependency.'
            },
            {
              'pattern': 'http://172.*',
              'status': 'PRIVATE_NETWORK_SECURITY_REFERENCE',
              'owner': 'network-security',
              'integration': 'Private-network literal is retained only as audited security/test input; ARCZ offline_strict does not grant private-network egress.',
              'rationale': 'RFC1918 address class, not a public provider dependency.'
            },
            {
              'pattern': 'http://192.168.*',
              'status': 'PRIVATE_NETWORK_SECURITY_REFERENCE',
              'owner': 'network-security',
              'integration': 'Private-network literal is retained only as audited security/test input; ARCZ offline_strict does not grant private-network egress.',
              'rationale': 'RFC1918 address class, not a public provider dependency.'
            },
            {
              'pattern': 'http://169.254.*',
              'status': 'LINK_LOCAL_SECURITY_REFERENCE',
              'owner': 'network-security',
              'integration': 'Link-local/cloud-metadata literals are explicit SSRF-denial fixtures; ARCZ must never route them.',
              'rationale': 'Aedifex safeFetch explicitly blocks link-local addresses including cloud metadata.'
            },
          ]

          def insert_rules(category: str, rules: list[dict]) -> None:
              current = categories[category]
              fallback = next(i for i, rule in enumerate(current) if rule.get('pattern') == '*')
              existing = {rule.get('pattern') for rule in current}
              additions = [rule for rule in rules if rule['pattern'] not in existing]
              current[fallback:fallback] = additions

          insert_rules('environment_variables', env_rules)
          insert_rules('external_urls', url_rules)
          path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python -m json.tool integrations/aedifex/CONVERSION_COVERAGE.json >/dev/null
          python -m pip install -q -r requirements-dev.txt
          python -m pytest -q
      - name: Commit reviewed policy
        shell: bash
        run: |
          rm -f .github/workflows/_patch-aedifex-network-policy.yml
          git config user.name 'ARCZ CI'
          git config user.email 'actions@users.noreply.github.com'
          git add integrations/aedifex/CONVERSION_COVERAGE.json .github/workflows/_patch-aedifex-network-policy.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: admit reviewed Aedifex local security surfaces'
          git push origin HEAD:agent/arcz-100-done
