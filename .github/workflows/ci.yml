name: ARCZ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcz-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gates:
    name: Python + JS + contracts + runtime smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm install --global typescript@5
      - name: Python compile gate
        run: python -m compileall -q arcz_server tools tests_python servidor.py arcz_export.py
      - name: Python tests
        run: python -m pytest -q
      - name: Cancellation/race stress
        run: python tools/job_cancel_stress.py --iterations 100
      - name: JavaScript tests
        run: node --test --experimental-default-type=module tests_js/*.mjs
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find app -type f -name '*.js' -print0)
      - name: Aedifex overlay TypeScript syntax
        run: node tools/check_typescript_syntax.mjs integrations/aedifex/overlay
      - name: Plugin catalog contract
        run: python tools/verify_plugin_catalog.py
      - name: Aedifex conversion matrix
        run: python tools/build_aedifex_conversion_matrix.py
      - name: Upstream lock dry-run
        run: python tools/materialize_upstreams.py --dry-run
      - name: Local runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          python servidor.py 8765 > /tmp/arcz-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/v2/health > /tmp/arcz-health.json; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/arcz-server.log
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          health=json.loads(Path('/tmp/arcz-health.json').read_text())
          assert health['ok'] is True
          assert health['api'] == '2'
          assert health['network_mode'] == 'offline_strict'
          required={'terrain.generate','roads.generate','buildings.generate','houses.generate','vegetation.generate','tiles.generate','materials.generate','sheets.compose','render.photoreal'}
          assert required.issubset(set(health['job_kinds']))
          PY
          curl -fsS http://127.0.0.1:8765/ > /tmp/arcz-index.html
          grep -q 'ARCZ Earth' /tmp/arcz-index.html

  rust-workspace:
    name: Rust 1.97.1 workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            pkg-config \
            patchelf
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustc --version
          cargo --version
      - name: Normalize Rust sources
        run: cargo fmt --all
      - uses: actions/upload-artifact@v4
        with:
          name: arcz-rustfmt-source
          path: crates/**/*.rs
          if-no-files-found: error
      - name: Resolve dependency lock
        run: cargo generate-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: arcz-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
      - name: Check workspace
        shell: bash
        run: |
          set +e
          cargo check --locked --workspace --all-targets > /tmp/arcz-cargo-check.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo '===== ARCZ RUST CHECK ERROR SUMMARY ====='
            grep -n -C 6 -E 'error(\[[A-Z0-9]+\])?:|could not compile|failed to' /tmp/arcz-cargo-check.log | tail -260 || true
            echo '===== LAST 120 LINES ====='
            tail -120 /tmp/arcz-cargo-check.log
          else
            echo 'cargo check --locked --workspace --all-targets: PASS'
          fi
          exit "$rc"
      - name: Test workspace
        shell: bash
        run: |
          set +e
          cargo test --locked --workspace --all-targets > /tmp/arcz-cargo-test.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo '===== ARCZ RUST TEST ERROR SUMMARY ====='
            grep -n -C 8 -E 'FAILED|failures:|error(\[[A-Z0-9]+\])?:|could not compile|test result: FAILED' /tmp/arcz-cargo-test.log | tail -300 || true
            echo '===== LAST 140 LINES ====='
            tail -140 /tmp/arcz-cargo-test.log
          else
            echo 'cargo test --locked --workspace --all-targets: PASS'
          fi
          exit "$rc"
      - name: Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --locked --workspace --all-targets -- -D warnings > /tmp/arcz-cargo-clippy.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo '===== ARCZ CLIPPY ERROR SUMMARY ====='
            grep -n -C 6 -E 'error(\[[A-Z0-9]+\])?:|could not compile|warning:' /tmp/arcz-cargo-clippy.log | tail -300 || true
            echo '===== LAST 120 LINES ====='
            tail -120 /tmp/arcz-cargo-clippy.log
          else
            echo 'cargo clippy --locked --workspace --all-targets -- -D warnings: PASS'
          fi
          exit "$rc"
      - name: Require committed rustfmt state
        run: git diff --exit-code -- '*.rs'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcz-rust-diagnostics
          path: |
            /tmp/arcz-cargo-check.log
            /tmp/arcz-cargo-test.log
            /tmp/arcz-cargo-clippy.log
          if-no-files-found: ignore

  integrity-report:
    name: Handoff integrity report
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [source-gates, rust-workspace]
    if: always()
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            pkg-config \
            patchelf
      - name: Install report dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm install --global typescript@5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
      - name: Generate honest handoff report
        continue-on-error: true
        run: python tools/verify_handoff.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcz-validation-report
          path: |
            validation/verification-report.json
            docs/audit/VALIDATION_REPORT.md
          if-no-files-found: warn
