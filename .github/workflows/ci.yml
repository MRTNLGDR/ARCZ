name: ARCZ CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcz-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gates:
    name: Python + JS + contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm install --global typescript@5
      - name: Python compile gate
        run: python -m compileall -q arcz_server tools tests_python servidor.py arcz_export.py
      - name: Python tests
        run: python -m pytest -q
      - name: Cancellation/race stress
        run: python tools/job_cancel_stress.py --iterations 100
      - name: JavaScript tests
        run: node --test --experimental-default-type=module tests_js/*.mjs
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find app -type f -name '*.js' -print0)
      - name: Aedifex overlay TypeScript syntax
        run: node tools/check_typescript_syntax.mjs integrations/aedifex/overlay
      - name: Plugin catalog contract
        run: python tools/verify_plugin_catalog.py
      - name: Aedifex conversion matrix
        run: python tools/build_aedifex_conversion_matrix.py
      - name: Upstream lock dry-run
        run: python tools/materialize_upstreams.py --dry-run

  rust-workspace:
    name: Rust stable workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check

  integrity-report:
    name: Handoff integrity report
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [source-gates, rust-workspace]
    if: always()
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install report dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm install --global typescript@5
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Generate honest handoff report
        continue-on-error: true
        run: python tools/verify_handoff.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcz-validation-report
          path: |
            validation/verification-report.json
            docs/audit/VALIDATION_REPORT.md
          if-no-files-found: warn
