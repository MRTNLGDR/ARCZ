name: ARCZ Aedifex Runtime Admission Patch

on:
  push:
    branches:
      - agent/arcz-100-done
    paths:
      - .github/workflows/_patch-aedifex-runtime-admission.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arcz-100-done
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch network scanner and reviewed policy
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          scanner = Path('arcz_server/aedifex_inventory.py')
          text = scanner.read_text(encoding='utf-8')
          if 'def _without_js_comments(' not in text:
              anchor = 'def _tool_ids(rel: str, path: Path, text: str) -> set[str]:\n'
              helper = r'''def _without_js_comments(text: str) -> str:
    """Blank JS/TS comments while preserving strings and line offsets."""
    out: list[str] = []
    i = 0
    state = "code"
    quote = ""
    while i < len(text):
        c = text[i]
        n = text[i + 1] if i + 1 < len(text) else ""
        if state == "code":
            if c == "/" and n == "/":
                out.extend("  ")
                i += 2
                state = "line_comment"
                continue
            if c == "/" and n == "*":
                out.extend("  ")
                i += 2
                state = "block_comment"
                continue
            if c in {"'", '"', '`'}:
                quote = c
                state = "string"
            out.append(c)
            i += 1
            continue
        if state == "line_comment":
            if c == "\n":
                out.append("\n")
                state = "code"
            else:
                out.append(" ")
            i += 1
            continue
        if state == "block_comment":
            if c == "*" and n == "/":
                out.extend("  ")
                i += 2
                state = "code"
            else:
                out.append("\n" if c == "\n" else " ")
                i += 1
            continue
        if state == "string":
            out.append(c)
            if c == "\\" and i + 1 < len(text):
                out.append(text[i + 1])
                i += 2
                continue
            if c == quote:
                state = "code"
            i += 1
    return "".join(out)


'''
              if anchor not in text:
                  raise SystemExit('tool_ids anchor missing')
              text = text.replace(anchor, helper + anchor, 1)

          old = '''        for match in NETWORK_CALL_RE.finditer(text):\n            line = _line_number(text, match.start())\n'''
          new = '''        network_text = _without_js_comments(text)\n        for match in NETWORK_CALL_RE.finditer(network_text):\n            line = _line_number(network_text, match.start())\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'NETWORK_CALL_RE.finditer(network_text)' not in text:
              raise SystemExit('network scan anchor missing')
          scanner.write_text(text, encoding='utf-8')

          policy_path = Path('integrations/aedifex/CONVERSION_COVERAGE.json')
          doc = json.loads(policy_path.read_text(encoding='utf-8'))
          cats = doc['categories']

          url_rules = [
              {
                  'pattern': 'https://byrpxoiotywskoojsrzd.supabase.co/storage/v1/object/public/items/*',
                  'source_patterns': ['packages/editor/src/components/ui/item-catalog/catalog-items.tsx'],
                  'status': 'CONTROLLED_FORK_LOCALIZATION_REQUIRED',
                  'owner': 'floorplanner-assets',
                  'integration': 'tools/vendor_aedifex.py rewrites every catalog model/thumbnail to /items local assets and fails closed when required local files are missing; missing optional floor plans are disabled.',
                  'rationale': 'Remote catalog content is never accepted as a shipped runtime dependency.'
              },
              {
                  'pattern': 'https://cdn.jsdelivr.net/gh/pmndrs/drei-assets@master/basis/',
                  'status': 'CONTROLLED_FORK_LOCALIZATION_REQUIRED',
                  'owner': 'floorplanner-rendering',
                  'integration': 'Fork rewrites KTX2 transcoderPath to /basis/ and build packages basis_transcoder.js/wasm from the pinned three dependency.',
                  'rationale': 'Eliminates runtime CDN dependency.'
              },
              {
                  'pattern': 'https://www.gstatic.com/draco/versioned/decoders/1.5.5/',
                  'status': 'CONTROLLED_FORK_LOCALIZATION_REQUIRED',
                  'owner': 'floorplanner-rendering',
                  'integration': 'Fork rewrites Draco decoder path to /draco/ and build packages decoder JS/WASM from the pinned three dependency.',
                  'rationale': 'Eliminates runtime gstatic dependency.'
              },
              {
                  'pattern': 'https://${process.env.NEXT_PUBLIC_VERCEL*',
                  'status': 'CONTROLLED_FORK_LOCALIZATION_REQUIRED',
                  'owner': 'floorplanner-shell',
                  'integration': 'Fork removes Vercel-derived production base URL logic and uses NEXT_PUBLIC_APP_URL or the loopback sidecar origin.',
                  'rationale': 'ARCZ does not depend on Vercel deployment metadata.'
              },
              {
                  'pattern': 'https://editor.aedifex.com',
                  'status': 'CONTROLLED_FORK_LOCALIZATION_REQUIRED',
                  'owner': 'floorplanner-shell',
                  'integration': 'Fork removes the remote editor fallback and makes asset paths same-origin/local.',
                  'rationale': 'No hidden editor.aedifex.com dependency in the shipped ARCZ host.'
              },
              {
                  'pattern': 'https://api.openai.com/v1',
                  'source_patterns': ['apps/editor/app/api/ai/*'],
                  'status': 'UPSTREAM_APP_ROUTE_NOT_SHIPPED',
                  'owner': 'local-ai-broker',
                  'integration': 'Original upstream AI API route is preserved only in the reference tree; ARCZ overlay chat uses the Local AI Broker.',
                  'rationale': 'No mandatory OpenAI runtime dependency.'
              },
              {
                  'pattern': 'https://byrpxoiotywskoojsrzd.supabase.co/storage/v1/object/public/ifc_examples',
                  'source_patterns': ['apps/ifc-converter/*'],
                  'status': 'UPSTREAM_APP_NOT_SHIPPED_REFERENCE',
                  'owner': 'floorplanner-exchange',
                  'integration': 'Standalone IFC demo app/test-file catalog is not the shipped ARCZ importer.',
                  'rationale': 'The integrated IFC converter consumes local/uploaded bytes and packages web-ifc WASM locally.'
              },
              {
                  'pattern': 'https://editor.aedifex.app/docs/developers/plugins',
                  'status': 'REFERENCE_LINK_ONLY',
                  'owner': 'documentation',
                  'integration': 'Optional documentation hyperlink; it is not fetched for core operation.',
                  'rationale': 'No runtime dependency.'
              },
              {
                  'pattern': 'https://env.t3.gg/docs/nextjs',
                  'status': 'REFERENCE_LINK_ONLY',
                  'owner': 'documentation',
                  'integration': 'Build-tool documentation reference only.',
                  'rationale': 'No runtime dependency.'
              },
              {
                  'pattern': 'https://nextjs.org/docs/app/api-reference/config/typescript',
                  'status': 'REFERENCE_LINK_ONLY',
                  'owner': 'documentation',
                  'integration': 'Generated Next.js type declaration documentation reference only.',
                  'rationale': 'No runtime dependency.'
              },
              {
                  'pattern': 'https://x.com/dangreenheck',
                  'status': 'REFERENCE_LINK_ONLY',
                  'owner': 'documentation',
                  'integration': 'Optional attribution/profile link in plugin UI; no fetch is required for plugin operation.',
                  'rationale': 'No runtime dependency.'
              },
              {
                  'pattern': 'https://',
                  'status': 'URL_SCHEME_LITERAL',
                  'owner': 'network-security',
                  'integration': 'Protocol prefix used by URL validators/resolvers, not a remote endpoint.',
                  'rationale': 'Static scheme literal.'
              },
              {
                  'pattern': 'https://…',
                  'status': 'DOCUMENTATION_EXAMPLE',
                  'owner': 'documentation',
                  'integration': 'Ellipsis example in source documentation.',
                  'rationale': 'Not a valid endpoint.'
              },
              {
                  'pattern': 'https://cdn.aedifex.com',
                  'source_patterns': ['packages/core/src/schema/asset-url*'],
                  'status': 'VALIDATION_EXAMPLE',
                  'owner': 'network-security',
                  'integration': 'Example origin for the optional asset-origin allowlist; not hardcoded as runtime authority.',
                  'rationale': 'Source/test example only.'
              },
          ]

          network_rules = [
              {
                  'pattern': 'packages/mcp/src/lib/safe-fetch.ts:*',
                  'status': 'SSRF_GUARDED_OPTIONAL_FETCH',
                  'owner': 'arcz-global-chat',
                  'integration': 'User-supplied image URL fetch is constrained to http(s), blocks loopback/private/link-local hosts, revalidates redirects, caps body size and times out.',
                  'rationale': 'Optional import capability with explicit SSRF controls; not a boot/runtime provider dependency.'
              },
              {
                  'pattern': 'packages/editor/src/lib/floorplan/floorplan-pdfkit-renderer.ts:*',
                  'status': 'OPTIONAL_USER_ASSET_FETCH',
                  'owner': 'floorplanner-export',
                  'integration': 'PDF export fetches only the asset URL resolved from scene geometry; local/blob assets work offline and remote user assets are optional input.',
                  'rationale': 'Export must not make application boot or authoring dependent on remote network.'
              },
          ]

          def insert_before_fallback(category, additions):
              rules = cats[category]
              fallback = next(i for i, rule in enumerate(rules) if rule.get('pattern') == '*' and not rule.get('source_patterns'))
              signatures = {(rule.get('pattern'), tuple(rule.get('source_patterns', [])), rule.get('status')) for rule in rules}
              clean = [r for r in additions if (r.get('pattern'), tuple(r.get('source_patterns', [])), r.get('status')) not in signatures]
              rules[fallback:fallback] = clean

          insert_before_fallback('external_urls', url_rules)
          insert_before_fallback('network_call_sites', network_rules)
          policy_path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python -m py_compile arcz_server/aedifex_inventory.py tools/vendor_aedifex.py tools/build_aedifex_sidecar.py
          python -m json.tool integrations/aedifex/CONVERSION_COVERAGE.json >/dev/null
          python -m pip install -q -r requirements-dev.txt
          python -m pytest -q
      - name: Commit verified admission patch
        shell: bash
        run: |
          rm -f .github/workflows/_patch-aedifex-runtime-admission.yml
          git config user.name 'ARCZ CI'
          git config user.email 'actions@users.noreply.github.com'
          git add arcz_server/aedifex_inventory.py integrations/aedifex/CONVERSION_COVERAGE.json .github/workflows/_patch-aedifex-runtime-admission.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: audit Aedifex runtime network surfaces precisely'
          git push origin HEAD:agent/arcz-100-done
