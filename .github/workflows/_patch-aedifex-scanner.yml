name: ARCZ Aedifex Scanner Patch

on:
  push:
    branches:
      - agent/arcz-100-done
    paths:
      - .github/workflows/_patch-aedifex-scanner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arcz-100-done
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch scanner and verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('arcz_server/aedifex_inventory.py')
          text = path.read_text(encoding='utf-8')

          old = '''KIND_RE = re.compile(r"\\bkind\\s*:\\s*['\\\"]([a-z][a-z0-9_.:-]*)['\\\"]", re.I)\n'''
          new = '''KIND_RE = re.compile(r"\\bkind\\s*:\\s*['\\\"]([a-z][a-z0-9_.:-]*)['\\\"]", re.I)\nNODE_DEFINITION_KIND_RE = re.compile(\n    r"\\bexport\\s+const\\s+[A-Za-z0-9_]+Definition\\s*:\\s*NodeDefinition(?:<[^{}]+>)?\\s*=\\s*\\{\\s*kind\\s*:\\s*['\\\"]([a-z][a-z0-9_.:-]*)['\\\"]",\n    re.I | re.S,\n)\n'''
          if 'NODE_DEFINITION_KIND_RE' not in text:
              if old not in text:
                  raise SystemExit('KIND_RE anchor not found')
              text = text.replace(old, new, 1)

          old_loop = '''            for kind in sorted(set(KIND_RE.findall(text))):\n                node_kinds.append({"id": kind, "source": rel, "discovered_by": "declaration"})\n'''
          new_loop = '''            if path.name == "definition.ts":\n                for kind in sorted(set(NODE_DEFINITION_KIND_RE.findall(text))):\n                    node_kinds.append(\n                        {"id": kind, "source": rel, "discovered_by": "node-definition"}\n                    )\n'''
          if old_loop in text:
              text = text.replace(old_loop, new_loop, 1)
          elif '"discovered_by": "node-definition"' not in text:
              raise SystemExit('node-kind scan anchor not found')

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile arcz_server/aedifex_inventory.py
          python -m pip install -q -r requirements-dev.txt
          python -m pytest -q
      - name: Commit verified patch
        shell: bash
        run: |
          rm -f .github/workflows/_patch-aedifex-scanner.yml
          git config user.name 'ARCZ CI'
          git config user.email 'actions@users.noreply.github.com'
          git add arcz_server/aedifex_inventory.py .github/workflows/_patch-aedifex-scanner.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: inventory only authoritative Aedifex node definitions'
          git push origin HEAD:agent/arcz-100-done
