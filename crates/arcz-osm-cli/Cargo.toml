[package]
name = "arcz-osm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI headless que gera o entorno OSM (predios/vias/vegetacao) como .glb, sem GPU/janela/servidor"

[[bin]]
name = "arcz-osm-cli"
path = "src/main.rs"

[dependencies]
arcz-geo.workspace = true
arcz-osm.workspace = true
arcz-terrain.workspace = true
anyhow.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
