<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCZ Earth · Visualizador 3D Georreferenciado</title>

<!--
  LOCAL-FIRST: nenhuma fonte é buscada na internet. O CSS usa as famílias
  instaladas no sistema. Fontes adicionais só podem entrar como assets locais
  licenciados e registrados no manifesto da distribuição; nunca via CDN.
-->

<!-- CesiumJS 1.144.0 local, construído do pin auditado em upstreams/manifest.toml. -->
<script>window.CESIUM_BASE_URL = "/vendor/cesium/Cesium/";</script>
<link rel="stylesheet" href="/vendor/cesium/Cesium/Widgets/widgets.css">
<script src="/vendor/cesium/Cesium/Cesium.js"></script>

<link rel="stylesheet" href="./app/estilo.css">
<link rel="stylesheet" href="./app/fusion-v6.css">
<link rel="stylesheet" href="./app/workflow-clean.css">
</head>
<body>

<div id="app_shell">
  <header id="topbar"></header>

  <div id="corpo">
    <aside id="menu"></aside>

    <main id="viewport">
      <div id="cesiumContainer"></div>
      <div id="hud_viewport"></div>
      <div id="hud_coords">—</div>
    </main>

    <aside id="trilha"></aside>
  </div>

  <footer id="statusbar"></footer>
</div>

<script type="module">
if (!globalThis.Cesium) {
  const shell = document.getElementById("app_shell");
  shell.className = "arcz-boot-blocked";
  shell.innerHTML = `
    <main class="arcz-boot-blocker">
      <div class="arcz-boot-blocker__card">
        <strong>Runtime geográfico local incompleto</strong>
        <h1>CesiumJS local não foi materializado.</h1>
        <p>O ARCZ não usa CDN nem fallback remoto. O mapa só abre quando o bundle auditado existe dentro de <code>vendor/cesium/Cesium</code>.</p>
        <ol>
          <li><code>python tools/materialize_upstreams.py --only cesiumjs</code></li>
          <li><code>python tools/vendor_cesium.py --from-pinned-source --allow-network --force</code></li>
          <li>Reabra o ARCZ. Depois do setup, o runtime funciona com os arquivos locais do repo.</li>
        </ol>
      </div>
    </main>`;
} else {
  await import("./app/main.js");
}
</script>
</body>
</html>
